<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Sidecar</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>OpenClaw Sidecar</h1>
          <p>Experimental extension for local OpenClaw</p>
        </div>
        <div class="topbar-actions">
          <button id="openSettingsBtn" class="ghost">插件设置</button>
          <button id="newSessionBtn" class="ghost">新对话</button>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <h2>连接状态</h2>
          <span id="connectionStatus" class="muted">未检查</span>
        </div>
        <div class="notice">
          配置入口只保留在插件设置页。侧栏不编辑 Gateway、OpenClaw 地址或 Token，只显示当前工作状态。
        </div>
        <div id="connectionSummary" class="status-grid"></div>
        <div class="actions">
          <button id="refreshStatusBtn" class="ghost">刷新状态</button>
          <button id="openSettingsSecondaryBtn" class="ghost">打开设置</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>当前会话</h2>
          <span id="sessionLabel" class="muted">未创建</span>
        </div>
        <div id="sessionMeta" class="muted">注入和提问都会进入当前会话</div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>提示词模板</h2>
        </div>
        <div id="promptList" class="prompt-list"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>注入当前页面</h2>
        </div>
        <label>
          附加指令
          <input id="instruction" type="text" placeholder="总结后支持后续检索" />
        </label>
        <div class="actions">
          <button id="injectPage">注入当前页</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>对话</h2>
        </div>
        <div id="messages" class="messages"></div>
        <label>
          提问
          <textarea id="question" rows="5" placeholder="例如：总结这页，并指出最关键的证据段落"></textarea>
        </label>
        <div class="actions">
          <button id="sendQuestion">发送问题</button>
        </div>
      </section>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
