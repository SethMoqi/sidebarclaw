<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SidebarClaw</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span id="statusPulse" class="status-pulse idle" aria-hidden="true"></span>
          <div>
            <h1>SidebarClaw</h1>
            <p id="sessionMeta">Not connected</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="refreshSessionBtn" class="ghost">Refresh</button>
          <button id="openSettingsBtn" class="ghost">Settings</button>
          <button id="newSessionBtn" class="ghost">New Session</button>
        </div>
      </header>

      <section class="status-strip">
        <button id="refreshStatusBtn" class="status-chip ghost" type="button">
          <span id="connectionStatus">Not checked</span>
        </button>
        <div id="sessionLabel" class="status-chip">No session</div>
        <div id="tabSummary" class="status-chip muted">0 tabs</div>
      </section>

      <main class="chat-shell">
        <div id="messages" class="messages"></div>
      </main>

      <section class="composer-shell">
        <div class="prompt-row">
          <div id="promptList" class="prompt-list"></div>
        </div>
        <details class="tools-panel">
          <summary>Sources and Injection</summary>
          <div class="tools-grid">
            <div class="mode-switch" role="radiogroup" aria-label="Injection mode">
              <button id="modeFullContent" class="mode-chip active" type="button">Capture Text</button>
              <button id="modeUrlReference" class="mode-chip" type="button">URLs Only</button>
            </div>
            <div class="tools-head">
              <div>
                <strong>Tabs</strong>
                <span id="selectedTabsLabel" class="muted">None selected</span>
              </div>
              <div class="mini-actions">
                <button id="refreshTabsBtn" class="ghost" type="button">Refresh Tabs</button>
                <button id="selectActiveBtn" class="ghost" type="button">Current Tab</button>
                <button id="selectAllBtn" class="ghost" type="button">Select All</button>
                <button id="clearSelectionBtn" class="ghost" type="button">Clear All</button>
              </div>
            </div>
            <div id="tabList" class="tab-list"></div>
            <label>
              Injection Prompt
              <textarea id="instruction" rows="3" placeholder="Store the page for follow-up retrieval and preserve the strongest evidence."></textarea>
            </label>
            <div class="actions">
              <button id="injectPage" type="button">Inject Selected Tabs</button>
            </div>
          </div>
        </details>
        <div class="composer">
          <label class="sr-only" for="question">Question</label>
          <textarea id="question" rows="4" placeholder="Ask a follow-up question about the injected page"></textarea>
          <div class="actions">
            <button id="sendQuestion" type="button">Send</button>
          </div>
        </div>
      </section>
    </div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
