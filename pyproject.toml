[project]
name = "longdoc-mvp"
version = "0.1.0"
description = "Minimal long-document processing and QA pipeline"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
